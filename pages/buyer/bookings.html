<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../../assets/logos/favicon.png">
  <title>My Booking — Sasy.Tix Maritime</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/buyer.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div id="demo-bar-mount"></div>
  <div id="site-header-mount"></div>

  <main class="section" style="padding-top:var(--space-8);">
    <div class="container">
      <div class="section-header" style="margin-bottom:var(--space-5);">
        <div>
          <span class="eyebrow">Riwayat Perjalanan</span>
          <h1 class="section-title">My Booking</h1>
        </div>
        <a href="search.html" class="btn btn--primary">Pesan Tiket Baru</a>
      </div>

      <div class="filter-bar" id="booking-filter-tabs" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;">
        <button type="button" class="btn btn--primary btn--sm" data-filter="all">All</button>
        <button type="button" class="btn btn--outline btn--sm" data-filter="upcoming">Upcoming</button>
        <button type="button" class="btn btn--outline btn--sm" data-filter="completed">Completed</button>
        <button type="button" class="btn btn--outline btn--sm" data-filter="cancelled">Cancelled</button>
      </div>

      <div id="my-bookings-list" style="display:flex; flex-direction:column; gap:16px;"></div>
    </div>
  </main>

  <div id="site-footer-mount"></div>

  <script src="../../js/mock-data.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/components/icons.js"></script>
  <script src="../../js/components/ui.js"></script>
  <script src="../../js/buyer/bookings.js"></script>
</body>
</html>
