<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../../assets/logos/favicon.png">
  <title>Autentikasi Akun — Sasy.Tix Maritime</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div id="site-header-mount"></div>

  <main class="section" style="padding-top:var(--space-10);">
    <div class="container" style="max-width:520px;">
      <div class="card">
        <div class="card-header" style="flex-wrap:wrap; gap:8px;">
          <div style="display:flex; gap:6px; flex-wrap:wrap;" id="auth-mode-tabs">
            <button type="button" class="btn btn--primary btn--sm" data-mode="login">Login</button>
            <button type="button" class="btn btn--outline btn--sm" data-mode="register">Register</button>
            <button type="button" class="btn btn--outline btn--sm" data-mode="forgot">Forgot Password</button>
            <button type="button" class="btn btn--outline btn--sm" data-mode="reset">Reset Password</button>
            <button type="button" class="btn btn--outline btn--sm" data-mode="otp">OTP</button>
            <button type="button" class="btn btn--outline btn--sm" data-mode="activate">Aktivasi</button>
          </div>
        </div>
        <div class="card-body" id="auth-form-mount"></div>
      </div>
    </div>
  </main>

  <div id="site-footer-mount"></div>

  <script src="../../js/mock-data.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/components/icons.js"></script>
  <script src="../../js/components/ui.js"></script>
  <script src="../../js/buyer/auth-page.js"></script>
</body>
</html>
