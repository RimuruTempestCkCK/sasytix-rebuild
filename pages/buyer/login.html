<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../../assets/logos/favicon.png">
  <title>Masuk ke Akun — Sasy.Tix Maritime</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/buyer.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body data-auth-page="login">
  <main class="auth-section">
    <div class="container" style="max-width:480px;">
      <div class="auth-brand-center" style="display:flex; justify-content:center; align-items:center; margin-bottom:24px;">
        <a href="../../index.html" aria-label="Sasy.Tix Beranda" style="display:inline-flex; align-items:center; justify-content:center;">
          <img src="../../assets/logos/logo.png" alt="Sasytix.com" style="height:46px; width:auto; margin:0 auto; display:block;">
        </a>
      </div>

      <div class="auth-card card">
        <div class="auth-card-header">
          <div class="auth-tabs-pill" id="auth-mode-tabs">
            <button type="button" class="auth-tab-btn is-active" data-mode="login">Masuk</button>
            <button type="button" class="auth-tab-btn" data-mode="register">Daftar Akun</button>
          </div>
        </div>
        <div class="card-body auth-card-body" id="auth-form-mount"></div>
      </div>

      <div style="text-align:center;">
        <a href="../../index.html" class="auth-back-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Kembali ke Beranda Sasy.Tix
        </a>
      </div>
    </div>
  </main>

  <!-- Google Account Picker Modal (Simulasi) -->
  <div class="modal-backdrop" id="google-auth-modal" aria-hidden="true">
    <div class="modal auth-google-modal">
      <div class="modal-header">
        <div style="display:flex; align-items:center; gap:10px;">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <h2 class="modal-title" style="font-size:1.05rem;">Pilih Akun Google (Simulasi)</h2>
        </div>
        <button type="button" class="btn btn--ghost btn--sm" id="close-google-modal" aria-label="Tutup">&times;</button>
      </div>
      <div class="modal-body">
        <p class="text-sm text-muted" style="margin-bottom:14px;">Pilih salah satu profil Google di bawah ini untuk autentikasi simulasi:</p>
        <div class="google-accounts-list" id="google-accounts-list"></div>
      </div>
      <div class="modal-footer" style="justify-content:space-between;">
        <span class="text-xs text-muted">🔒 Simulasi Google OAuth 2.0</span>
        <button type="button" class="btn btn--outline btn--sm" id="cancel-google-modal">Batal</button>
      </div>
    </div>
  </div>

  <script src="../../js/mock-data.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/components/icons.js"></script>
  <script src="../../js/components/ui.js"></script>
  <script src="../../js/buyer/auth-page.js"></script>
</body>
</html>
